# valheim-gamestats without Kubernetes: the two containers of the chart, sharing one data directory.
# docs/MANUAL-DEPLOYMENT.md walks through it. Put a TLS-terminating proxy (Caddy, Traefik, nginx) in front of web.
services:
  collector:
    image: ghcr.io/xx4h/valheim-gamestats/collector:1.22.0   # or your own build, see the doc
    restart: unless-stopped
    user: "101:101"
    read_only: true
    env_file: secrets.env              # GS_MY_VALHEIM_RCON_PASSWORD=…, optional webhooks and API keys
    environment:
      CONFIG: /config/config.json
      DATA_DIR: /data
      TZ: UTC
    volumes:
      - ./config.json:/config/config.json:ro
      - ./data:/data
      # with a world.path file source (docs/MANUAL-DEPLOYMENT.md, 6.): the game server's files, read-only
      # - /home/valheim/valheim-server:/game:ro
  web:
    image: ghcr.io/xx4h/valheim-gamestats/web:1.22.0
    restart: unless-stopped
    user: "101:101"
    read_only: true
    ports:
      - "8080:8080"
    tmpfs:
      - /tmp
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data:/data:ro
