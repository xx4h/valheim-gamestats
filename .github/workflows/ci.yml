# Tests (collector rules, the page in a browser, the chart), the plugin built against the game's own assemblies, the
# two images. On main, when all of that passed and Chart.yaml's version has no release yet: the images get the version
# and the release vX.Y.Z (its tag, the plugin attached) is created — deployments follow those tags, never a branch.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io/${{ github.repository }}  # images: <this>/collector, <this>/web

jobs:
  # the collector on the oldest Python it supports (pyproject.toml) and the one its image runs; the latter with
  # coverage, which must not drop below the floor (test-only tool: the collector itself needs nothing installed)
  collector:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.12", "3.14.8"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python3 -m compileall -q collector tools tests/collector demo
      - if: matrix.python == '3.14.8'
        working-directory: tests/collector
        run: |
          pip install --quiet --no-cache-dir coverage==7.16.2
          coverage run --source=../../collector/valheim_gamestats -m unittest discover -s . -v
          coverage report --fail-under=90
      - if: matrix.python != '3.14.8'
        run: python3 -m unittest discover -s tests/collector -v

  ruff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14.8"
      - run: pip install --quiet --no-cache-dir ruff==0.16.10
      - run: ruff check --config collector/pyproject.toml collector tests/collector tools demo

  site:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.63.0-noble  # same version as tests/site/package.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - working-directory: tests/site
        run: |
          npm ci --no-audit --no-fund
          npx playwright test
        env:
          HOME: /root  # Firefox/Chromium in the container want the image's own home
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: site-test-results
          path: tests/site/test-results/
          retention-days: 7

  chart:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
        with:
          version: v3.19.5
      - run: tests/chart/check.sh

  # chart, images and plugin are one release: one version, written in four places
  versions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: |
          chart=$(sed -n 's/^version: *//p' chart/valheim-gamestats/Chart.yaml)
          app=$(sed -n 's/^appVersion: *"\{0,1\}\([^"]*\)"\{0,1\}/\1/p' chart/valheim-gamestats/Chart.yaml)
          plugin=$(sed -n 's/.*const string Version = "\(.*\)";.*/\1/p' plugin/Plugin.cs)
          collector=$(sed -n 's/^__version__ = "\([^"]*\)".*/\1/p' collector/valheim_gamestats/__init__.py)
          echo "chart $chart, appVersion $app, plugin $plugin, collector $collector"
          test -n "$chart" && test "$chart" = "$app" && test "$chart" = "$plugin" && test "$chart" = "$collector"

  # The plugin against the game: the dedicated server through SteamCMD, BepInEx and ValheimRcon from Thunderstore
  # (plugin/fetch-refs.sh — nothing proprietary is stored by this project). The server download is cached per Steam
  # build: a new game version is a new download, the same one comes from the cache. (A game update without a push to
  # this repository: .github/workflows/game.yml checks daily.)
  plugin:
    runs-on: ubuntu-24.04
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      STEAM_DIR: ${{ github.workspace }}/../valheim-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - id: game
        run: echo "build=$(plugin/game-build.sh)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ env.STEAM_DIR }}
          key: valheim-server-${{ steps.game.outputs.build }}
          restore-keys: valheim-server-
      - run: plugin/fetch-refs.sh
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: "8.0.x"
      - working-directory: plugin
        run: |
          dotnet build -c Release -nologo -warnaserror
          cp bin/Release/net48/ValheimGamestats.dll lib/valheim-build.txt ..
          sha256sum ../ValheimGamestats.dll
      - working-directory: tests/plugin
        run: dotnet run  # the event store outside the game, every hook against the game's assemblies
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: plugin
          path: |
            ValheimGamestats.dll
            valheim-build.txt
          retention-days: 30

  # Built for every change; pushed (as :<sha>, and :main on main) only from this repository's own pushes.
  images:
    runs-on: ubuntu-24.04
    needs: [collector, ruff, site, chart, versions]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: |
          set -e
          for target in collector web; do
            buildah bud --layers -f "containers/$target/Containerfile" --tag "$REGISTRY/$target:$GITHUB_SHA" .
          done
      - if: github.event_name == 'push'
        run: |
          set -e
          echo "${{ secrets.GITHUB_TOKEN }}" | buildah login -u "${{ github.actor }}" --password-stdin ghcr.io
          for target in collector web; do
            buildah push "$REGISTRY/$target:$GITHUB_SHA"
            if [ "$GITHUB_REF" = refs/heads/main ]; then buildah push "$REGISTRY/$target:$GITHUB_SHA" "docker://$REGISTRY/$target:main"; fi
          done

  # Only on main, only after everything above, only once per version. The release (and its tag) is created last, so a
  # tag always means: images and plugin are there.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    needs: [images, plugin]
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: plugin
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION=$(sed -n 's/^version: *//p' chart/valheim-gamestats/Chart.yaml)
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION is released already — bump the version (Chart.yaml, Plugin.cs, __init__.py) to release"
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | skopeo login -u "${{ github.actor }}" --password-stdin ghcr.io
          for target in collector web; do
            skopeo copy --all "docker://$REGISTRY/$target:$GITHUB_SHA" "docker://$REGISTRY/$target:$VERSION"
          done
          sha=$(sha256sum ValheimGamestats.dll | cut -d' ' -f1)
          {
            echo "Images \`$REGISTRY/collector:$VERSION\`, \`$REGISTRY/web:$VERSION\`; Helm chart \`chart/valheim-gamestats\` at this tag."
            echo
            echo "Plugin \`ValheimGamestats.dll\` (sha256 \`$sha\`), built against the Valheim dedicated server ($(cat valheim-build.txt))."
            echo "Install or update it as in [docs/PLUGIN-DEPLOYMENT.md](docs/PLUGIN-DEPLOYMENT.md)."
          } > notes.md
          gh release create "v$VERSION" ValheimGamestats.dll --target "$GITHUB_SHA" --title "v$VERSION" --notes-file notes.md
          echo "released v$VERSION"
